<!--
  Sorgente vettoriale dell'icona di JuTrack. I PNG di questa cartella si rigenerano
  da qui: non modificarli a mano, o la prossima rigenerazione li sovrascrive.

  Il segno: una lente — l'intersezione di due cerchi che non si disegnano — con la J
  di JuJu ritagliata dentro. Due forme che si sovrappongono, e quello che resta e' la
  parte in comune.

  Geometria: due archi di raggio 256 fra (594.6, 294.6) e (429.4, 729.4), scalati di
  1.18 attorno al centro della tela. Ne esce un ingombro di 370x514, con semidiagonale
  317: dentro la zona sicura delle icone adattive di Android, che ha raggio 338. E' un
  margine di appena il 6%, quindi la scala non va aumentata.

  La J e' un TRACCIATO e non un <text>, di proposito: era Cormorant Garamond a peso
  400, e lasciarla come testo avrebbe legato la rigenerazione delle icone a un font
  installato sulla macchina. Il tracciato e' stato estratto una volta dall'istanza
  wght=400 del font variabile — il cui default e' 300, che avrebbe dato una J piu'
  sottile di quella disegnata.

  La J e' un buco nella lente, non una forma sopra: nella silhouette monocromatica
  delle notifiche resta trasparente e la lettera si legge lo stesso.

  Il viola #5B3E9E del disegno originale e' stato portato sull'indaco #3B5BDB, che e'
  `accent` in theme/tokens.ts: il colore di ogni azione primaria, dei grafici e dei due
  widget. Un'icona di un colore e l'interfaccia di un altro si notano aprendo l'app.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <mask id="buco-j" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M594.6 294.6 A256 256 0 0 1 429.4 729.4 A256 256 0 0 1 594.6 294.6 Z"
        transform="translate(512,512) scale(1.18) translate(-512,-512)" fill="#FFFFFF"/>
